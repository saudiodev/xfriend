[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xfriend"
version = "0.1.0"
description = "X/Friend — modular AI companion framework for AI girlfriends & boyfriends: swappable LLM (Venice/Grok/LongCat) + image (Qwen/Wavespeed + LoRAs) + voice (SecretVoice), with rolling-scene memory compaction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "codysaudio" }]
keywords = ["ai", "companion", "llm", "tts", "image", "qwen", "wavespeed", "secretaudio", "venice"]
dependencies = [
    "openai>=1.40",
    "PyYAML>=6.0",
    "typer>=0.12",
    "requests>=2.31",
]

[project.optional-dependencies]
venice = []
grok = []
longcat = []
wavespeed = []
secretaudio = []
all = ["xfriend[venice,grok,longcat,wavespeed,secretaudio]"]

[project.scripts]
xfriend = "xfriend.cli:main"

[tool.setuptools.packages.find]
include = ["xfriend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]